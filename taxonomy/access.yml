OPEN: Free data without an account; terms and attribution can still apply.
REGISTER: Free data after account creation or a user registration form, without substantive project review.
APPLY: No data fee, but a research application or authorization is required; approval is not guaranteed.
REQUEST: Free data supplied on an individual request, only when the no-fee route is documented.
METADATA_ONLY: Discovery/reference only; this record does not establish access to the underlying data.
PAID: A purchase or subscription is required. Never included as an available free dataset.
